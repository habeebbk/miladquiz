<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz Completed — Thank You</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/remixicon@4.2.0/fonts/remixicon.css" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>

<body class="registration-page">

  <nav class="navbar">
    <a href="/" class="nav-brand">
      <img src="/images/12.png" alt="Logo" class="nav-logo" onerror="this.src='/images/LOGO.png'">
    </a>
  </nav>

  <main class="main-container">
    <div class="card">
      <div style="width:72px; height:72px; border-radius:50%; background:rgba(0,176,116,0.1); color:#00B074; display:flex; align-items:center; justify-content:center; font-size:36px; margin:0 auto 18px;">
        <i class="ri-checkbox-circle-fill"></i>
      </div>
      <div class="card-header">
        <h2>Thank You!</h2>
        <p>Your quiz submission has been recorded successfully.</p>
      </div>

      <div style="background:#f8fafc; border:1px solid #e2e8f0; border-radius:12px; padding:16px; margin:20px 0; font-size:14px; color:#475569;">
        Winners will be announced after the competition closes.
      </div>

      <a href="/" class="btn-submit" style="display:block; text-decoration:none; text-align:center;">Back to Home</a>
    </div>
  </main>

  <!-- Footer with Logo -->
  <footer class="footer">
    <div class="footer-brand">
      <img src="/images/LOGO.png" alt="SSF Logo" class="footer-logo" onerror="this.src='/images/12.png'">
      <span class="unit-name">SSF Puthupparamba Kaaratangadi Unit</span>
    </div>
    <p class="footer-rights">© 2026 All rights reserved.</p>
  </footer>

</body>

</html>
