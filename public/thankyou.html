<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz Completed — Thank You</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
    rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/remixicon@4.2.0/fonts/remixicon.css" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>

<body class="registration-page">

  <nav class="navbar">
    <a href="/" class="nav-brand">
      <img src="/images/bird-logo.png" alt="Logo" class="nav-logo" onerror="this.src='/images/LOGO.png'">
    </a>
  </nav>

  <main class="main-container">
    <div class="card">
      <div
        style="width:72px; height:72px; border-radius:50%; background:rgba(0,176,116,0.1); color:#00B074; display:flex; align-items:center; justify-content:center; font-size:36px; margin:0 auto 18px;">
        <i class="ri-checkbox-circle-fill"></i>
      </div>
      <div class="card-header">
        <h2>Thank You!</h2>
        <p>Your quiz submission has been recorded successfully.</p>
      </div>

      <div
        style="background:#f8fafc; border:1px solid #e2e8f0; border-radius:12px; padding:16px; margin:20px 0; font-size:14px; color:#475569;">
        Winners will be announced after the competition closes.
      </div>

      <!-- Donation / GPay QR Code Card -->
      <div style="background:#ffffff; border:1.5px solid #e2e8f0; border-radius:16px; padding:20px 16px; margin:24px 0 20px; text-align:center; box-shadow:0 4px 15px rgba(0,0,0,0.04);">
        <div style="display:flex; align-items:center; justify-content:center; gap:8px; margin-bottom:6px; color:#1e293b; font-weight:700; font-size:16px;">
          <i class="ri-heart-3-fill" style="color:#ef4444; font-size:20px;"></i>
          <span>Support Our Milad Campaign</span>
        </div>
        <p style="font-size:13px; color:#64748b; margin-bottom:16px;">Scan with Google Pay / PhonePe / Paytm to Donate</p>

        <div style="background:#ffffff; border:1.5px dashed #cbd5e1; border-radius:14px; padding:12px; display:inline-block; margin-bottom:14px;">
          <img src="/images/qr-code.png" alt="Google Pay QR Code" style="width:190px; height:190px; object-fit:contain; border-radius:8px; display:block;">
        </div>

        <div style="display:flex; align-items:center; justify-content:center; gap:6px; font-size:12px; font-weight:600; color:#00B074; background:rgba(0,176,116,0.08); padding:6px 14px; border-radius:20px; width:fit-content; margin:0 auto;">
          <i class="ri-qr-code-line"></i> Google Pay & UPI Accepted
        </div>
      </div>

      <a href="/" class="btn-submit" style="display:block; text-decoration:none; text-align:center;">Back to Home</a>
    </div>
  </main>

  <!-- Footer with Logo -->
  <footer class="footer">
    <div class="footer-brand">
      <img src="/images/bird-logo.png" alt="SSF Logo" class="footer-logo" onerror="this.src='/images/LOGO.png'">
      <span class="unit-name">SSF Puthupparamba Kaaratangadi Unit</span>
    </div>
    <p class="footer-rights">©beeb</p>
  </footer>

</body>

</html>
