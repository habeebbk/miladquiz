<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login — Quiz Competition</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/remixicon@4.2.0/fonts/remixicon.css" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>

<body class="registration-page">

  <nav class="navbar">
    <a href="/" class="nav-brand">
      <img src="/images/12.png" alt="Logo" class="nav-logo" onerror="this.src='/images/LOGO.png'">
    </a>
    <div class="nav-actions">
      <a href="/" class="btn-nav">Back to Site</a>
    </div>
  </nav>

  <main class="main-container">
    <div class="card">
      <div class="card-header">
        <h2>Admin Login</h2>
        <p>Sign in to view submissions and participant scores</p>
      </div>

      <div id="errorBox" class="error-box"></div>

      <form id="adminLoginForm">
        <div class="form-group">
          <label for="username">Username</label>
          <div class="input-wrapper">
            <i class="ri-user-settings-line"></i>
            <input type="text" id="username" name="username" placeholder="Enter username" required autocomplete="username">
          </div>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <div class="input-wrapper">
            <i class="ri-lock-password-line"></i>
            <input type="password" id="password" name="password" placeholder="Enter password" required autocomplete="current-password">
          </div>
        </div>

        <button type="submit" class="btn-submit" id="loginBtn">Login to Dashboard</button>
      </form>
    </div>
  </main>

  <script>
    const form = document.getElementById('adminLoginForm');
    const errorBox = document.getElementById('errorBox');
    const loginBtn = document.getElementById('loginBtn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorBox.style.display = 'none';

      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;

      if (loginBtn) {
        loginBtn.disabled = true;
        loginBtn.textContent = 'Logging in...';
      }

      try {
        const res = await fetch('/api/admin/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });

        const data = await res.json();

        if (!res.ok) {
          throw new Error(data.error || 'Invalid admin username or password.');
        }

        window.location.href = '/admin/dashboard.html';
      } catch (err) {
        errorBox.textContent = err.message;
        errorBox.style.display = 'block';
        if (loginBtn) {
          loginBtn.disabled = false;
          loginBtn.textContent = 'Login to Dashboard';
        }
      }
    });
  </script>
</body>

</html>
