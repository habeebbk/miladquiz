<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz in Progress — Competition</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
    rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/remixicon@4.2.0/fonts/remixicon.css" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css?v=1.2">
</head>

<body class="registration-page">

  <nav class="navbar">
    <a href="/" class="nav-brand">
      <img src="/images/12.png" alt="Logo" class="nav-logo" onerror="this.src='/images/LOGO.png'">
    </a>
    <div class="nav-actions">
      <span id="timerContainer" style="color:#00B074; font-weight:700; font-size:14px;"><i class="ri-timer-line"></i>
        <span id="timerDisplay">20s</span></span>
    </div>
  </nav>

  <main class="main-container">
    <div class="card" style="max-width: 600px;">
      <div class="card-header"
        style="display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid #e2e8f0; padding-bottom:12px;">
        <h2 style="font-size:20px; margin:0;">Question <span id="questionNum">1</span></h2>
        <span style="font-size:14px; font-weight:600; color:#00B074;" id="scoreTracker">Quiz Live</span>
      </div>

      <div id="errorBox" class="error-box" style="margin-top: 15px;"></div>

      <div id="quizContainer" style="margin-top:20px; text-align:left;">
        <p id="questionText"
          style="font-size:17px; font-weight:600; color:#1e293b; line-height:1.5; margin-bottom:20px;">Loading
          question...</p>

        <div id="optionsContainer" style="display:flex; flex-direction:column; gap:12px;">
          <!-- Options dynamically rendered here -->
        </div>

        <button type="button" id="nextBtn" class="btn-submit" style="margin-top:24px;">Next Question</button>
      </div>
    </div>
  </main>

  <!-- Footer with Logo -->
  <footer class="footer">
    <div class="footer-brand">
      <img src="/images/LOGO.png" alt="SSF Logo" class="footer-logo" onerror="this.src='/images/12.png'">
      <span class="unit-name">SSF Puthupparamba Kaaratangadi Unit</span>
    </div>
    <p class="footer-rights">© 2026 All rights reserved.</p>
  </footer>

  <script src="/js/quiz.js?v=1.7"></script>
</body>

</html>
